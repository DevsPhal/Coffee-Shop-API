spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Coffee-Shop-API

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
    debug: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

mail:
  shop:
    email: ${MAIL_USERNAME}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    user-name: ${TELEGRAM_BOT_USERNAME}

bakong:
  base-url: ${BAKONG_BASE_URL:}
  email: ${BAKONG_EMAIL:}
  token: ${BAKONG_TOKEN:}
  account-id: ${BAKONG_ACCOUNT_ID:}
  merchant-name: ${BAKONG_MERCHANT_NAME:}
  merchant-city: ${BAKONG_MERCHANT_CITY:}
  merchant-category-code: ${BAKONG_MERCHANT_CATEGORY_CODE:5999}
  merchant-id: ${BAKONG_MERCHANT_ID:}
  acquiring-bank: ${BAKONG_ACQUIRING_BANK:}
  store-label: ${BAKONG_STORE_LABEL:590st Cafe}
  terminal-label: ${BAKONG_TERMINAL_LABEL:POS}
  mobile-number: ${BAKONG_MOBILE_NUMBER:}
  purpose-of-transaction: ${BAKONG_PURPOSE_OF_TRANSACTION:Payment}
  expiration-minutes: ${BAKONG_EXPIRATION_MINUTES:15}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${minio.endpoint}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:590st-public}

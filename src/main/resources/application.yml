spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: local

  application:
    name: Coffee-Shop-API

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.group1.coffeeshopapi.config.NoEnumCheckPostgreSQLDialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    debug: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    time-zone: Asia/Phnom_Penh
    deserialization:
      accept-empty-string-as-null-object: true

bakong:
  base-url: ${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
  token: ${BAKONG_TOKEN:}
  email: ${BAKONG_EMAIL:}
  account-id: ${BAKONG_ACCOUNT_ID:}
  account-information: ${BAKONG_ACCOUNT_INFORMATION:}
  acquiring-bank: ${BAKONG_ACQUIRING_BANK:}
  merchant-name: ${BAKONG_MERCHANT_NAME:}
  merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
  merchant-category-code: ${BAKONG_MERCHANT_CATEGORY_CODE:5999}
  store-label: ${BAKONG_STORE_LABEL:590st Cafe}
  terminal-label: ${BAKONG_TERMINAL_LABEL:POS}
  purpose-of-transaction: ${BAKONG_PURPOSE_OF_TRANSACTION:Payment}
  currency: ${BAKONG_CURRENCY:USD}
  expiration-minutes: ${BAKONG_EXPIRATION_MINUTES:15}
  auto-confirm-interval-ms: ${BAKONG_AUTO_CONFIRM_INTERVAL_MS:10000}
  khr-per-usd-rate: ${BAKONG_KHR_PER_USD_RATE:4100}
  app-icon-url: ${BAKONG_APP_ICON_URL:https://590stcafe.shop/images/Logo.svg}
  deeplink-callback-url: ${BAKONG_DEEPLINK_CALLBACK_URL:https://590stcafe.shop/}

shop:
  location:
    latitude: ${SHOP_LATITUDE:}
    longitude: ${SHOP_LONGITUDE:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:590st-public}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

mail:
  sender:
    address: ${MAIL_FROM:otp@590stcafe.shop}
    name: ${MAIL_FROM_NAME:590st Cafe}
    support-email: ${MAIL_SUPPORT_EMAIL:${MAIL_FROM:otp@590stcafe.shop}}

app:
  auth:
    otp-expiry-minutes: ${APP_AUTH_OTP_EXPIRY_MINUTES:5}
    otp-max-attempts: ${APP_AUTH_OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown-seconds: ${APP_AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
  staff-call:
    cooldown-seconds: ${APP_STAFF_CALL_COOLDOWN_SECONDS:30}
    reply-visible-minutes: ${APP_STAFF_CALL_REPLY_VISIBLE_MINUTES:60}
  table:
    scan-base-url: ${APP_TABLE_SCAN_BASE_URL:https://590stcafe.shop/table/}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://admin.590stcafe.shop}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  login-domain: ${TELEGRAM_LOGIN_DOMAIN:590stcafe.shop}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL:}
  auto-register-webhook: ${TELEGRAM_AUTO_REGISTER_WEBHOOK:true}
  link-code-ttl-seconds: ${TELEGRAM_LINK_CODE_TTL_SECONDS:300}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  show-actuator: false

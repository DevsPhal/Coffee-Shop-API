spring:
  config:
    import: optional:file:.env[.properties]

  # Falls back to "local" whenever nothing else says otherwise — running from an IDE or
  # `./gradlew bootRun` just works with no extra setup. Deployment/production/docker-compose.yml
  # overrides this to "production" via a real container environment variable (a plain .env file
  # can't activate a profile — Spring only honors SPRING_PROFILES_ACTIVE from an actual OS/process
  # environment variable, not from spring.config.import's file-based property source).
  # See application-local.yml / application-production.yml for what each one changes.
  profiles:
    active: local

  application:
    name: Coffee-Shop-API

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Prevents Hibernate from auto-generating CHECK constraints on @Enumerated(STRING) columns —
    # see NoEnumCheckPostgreSQLDialect for why: with no migration tool, ddl-auto: update never
    # revisits those constraints when an enum's values change, so they silently go stale.
    database-platform: org.group1.coffeeshopapi.config.NoEnumCheckPostgreSQLDialect

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
    debug: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # LocalDateTime itself carries no zone, so the JVM default set in
  # CoffeeShopApiApplication's static block is what actually fixes "now" everywhere — this just
  # keeps Jackson consistent with that same zone for any zone-aware type (Instant/OffsetDateTime).
  jackson:
    time-zone: Asia/Phnom_Penh

bakong:
  base-url: ${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
  token: ${BAKONG_TOKEN:}
  account-id: ${BAKONG_ACCOUNT_ID:}
  account-information: ${BAKONG_ACCOUNT_INFORMATION:}
  acquiring-bank: ${BAKONG_ACQUIRING_BANK:}
  merchant-name: ${BAKONG_MERCHANT_NAME:}
  merchant-city: ${BAKONG_MERCHANT_CITY:Phnom Penh}
  merchant-category-code: ${BAKONG_MERCHANT_CATEGORY_CODE:5999}
  store-label: ${BAKONG_STORE_LABEL:Coffee Shop}
  terminal-label: ${BAKONG_TERMINAL_LABEL:POS}
  purpose-of-transaction: ${BAKONG_PURPOSE_OF_TRANSACTION:Payment}
  currency: ${BAKONG_CURRENCY:USD}
  expiration-minutes: ${BAKONG_EXPIRATION_MINUTES:15}
  khr-per-usd-rate: ${BAKONG_KHR_PER_USD_RATE:4100}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET_NAME:590st-public}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

mail:
  shop:
    email: ${MAIL_USERNAME}

app:
  auth:
    # log-otp is intentionally not set here — see application-local.yml / application-production.yml.
    otp-expiry-minutes: ${APP_AUTH_OTP_EXPIRY_MINUTES:5}
    otp-max-attempts: ${APP_AUTH_OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown-seconds: ${APP_AUTH_OTP_RESEND_COOLDOWN_SECONDS:60}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL:}
  auto-register-webhook: ${TELEGRAM_AUTO_REGISTER_WEBHOOK:true}
  link-code-ttl-seconds: ${TELEGRAM_LINK_CODE_TTL_SECONDS:300}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  show-actuator: false
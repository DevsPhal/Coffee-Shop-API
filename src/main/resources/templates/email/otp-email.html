<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${purposeLabel} + ' Verification Code'">Verification Code</title>
</head>
<body style="margin:0; padding:0; background-color:#f4ede4; font-family:Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4ede4; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(36,24,17,0.08);">
                <tr>
                    <td style="background-color:#241811; padding:24px 32px;">
                        <span style="color:#fbf7ef; font-size:20px; font-weight:600; letter-spacing:0.5px;">590st Cafe</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 8px; color:#241811; font-size:16px;">
                            Hi <span th:text="${fullName}">there</span>,
                        </p>
                        <p style="margin:0 0 24px; color:#5c4a3a; font-size:14px; line-height:1.5;">
                            Use the code below to complete your <span th:text="${purposeLabel}">action</span>.
                            This code expires in <span th:text="${expiryMinutes}">5</span> minutes.
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:16px 0;">
                                    <div style="display:inline-block; border:2px dashed #a9743c; border-radius:8px; padding:16px 32px; background-color:#fbf7ef;">
                                        <span th:text="${otp}"
                                              style="font-size:32px; font-weight:700; letter-spacing:8px; color:#241811; font-family:Consolas, monospace;">
                                            000000
                                        </span>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:24px 0 0; color:#8a7a6b; font-size:13px; line-height:1.5;">
                            Didn't request this code? You can safely ignore this email — no changes will be made
                            to your account.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px; background-color:#fbf7ef; border-top:1px solid #eadfce;">
                        <p style="margin:0; color:#a9998a; font-size:12px;">
                            Need help? Contact us at <span th:text="${shopEmail}">support@590stcafe.com</span>
                        </p>
                        <p style="margin:4px 0 0; color:#c3b7aa; font-size:11px;">
                            &copy; 590st Cafe. All rights reserved.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

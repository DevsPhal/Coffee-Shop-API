spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

# Stub values for placeholders that application.yml requires with no default
# (${MAIL_HOST} etc.) — the test profile never sends real mail or issues real
# JWTs, so these just need to exist for the context to start.
MAIL_HOST: localhost
MAIL_PORT: 3025
MAIL_USERNAME: test@example.com
MAIL_PASSWORD: test

jwt:
  secret: test-jwt-secret-test-jwt-secret-test-jwt-secret
  expiration: 3600000
  refresh-expiration: 604800000
